- q: How long does a first project take?
  a: >-
    A start-small engagement is sized to show a working result in weeks, not
    quarters. Larger programmes are planned in releases, so you see progress
    the whole way.
- q: Do we have to replace our ERP or planning tools?
  a: No. We connect to what you already have and add only what’s missing.
- q: Where does it run, and who owns it?
  a: >-
    In your own cloud environment, or hosted by us — whichever suits your team.
    Your data and the work we build for you stay yours.
- q: How do you price?
  a: >-
    The diagnostic is a fixed price agreed up front. Builds are scoped release
    by release, so you always know what the next step costs before it starts.
- q: Can we try Demand Pilot?
  a: >-
    It’s in beta and we’re taking a small number of teams. Tell us about your
    planning setup using the form below.
