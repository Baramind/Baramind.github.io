<section class="section section-inv" id="contact">
  <div class="wrap">
    <p class="eyebrow">Get in touch</p>
    <h2 class="h-big" style="margin-bottom: 48px">Tell us what you’re trying to decide.</h2>
    <form class="mad-lib" action="{{ site.Params.contactEndpoint }}" method="post" data-contact data-email="{{ site.Params.email }}">
      Hi, I’m
      <label class="sr-only" for="c-name">Your name</label><input id="c-name" name="name" placeholder="your name" autocomplete="name" required>
      from
      <label class="sr-only" for="c-company">Company</label><input id="c-company" name="company" placeholder="company" autocomplete="organization" required>.
      We’d like help with
      <label class="sr-only" for="c-topic">Topic</label><select id="c-topic" name="topic">
        <option>Demand Pilot (beta)</option>
        <option>data engineering</option>
        <option>data science</option>
        <option>supply chain planning</option>
        <option>something else</option>
      </select>.
      Reach me at
      <label class="sr-only" for="c-email">Email</label><input id="c-email" name="email" type="email" placeholder="email" autocomplete="email" required>.
      <label class="sr-only" for="c-msg">Anything else we should know?</label>
      <textarea id="c-msg" name="message" placeholder="Anything else we should know? (optional)"></textarea>
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Send</button>
        <span>or email <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a></span>
      </div>
      <p class="form-status" data-status role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
