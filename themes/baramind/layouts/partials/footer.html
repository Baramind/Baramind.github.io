<footer class="site-footer">
  <div class="wrap">
    <a href="{{ "/" | relURL }}" class="wordmark">{{ partial "logo.html" . }}<span>Baramind</span></a>
    <nav aria-label="Footer">
      {{- range site.Menus.main }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}
      <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
    </nav>
    <span>&copy; {{ now.Format "2006" }} Baramind</span>
  </div>
</footer>
