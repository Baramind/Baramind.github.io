{{- $current := . }}
<div class="wrap nav">
  <a href="{{ "/" | relURL }}" class="wordmark" aria-label="Baramind home">{{ partial "logo.html" . }}<span>Baramind</span></a>
  <nav class="nav-links" aria-label="Main">
    {{- range site.Menus.main }}
    <a href="{{ .URL | relURL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
    {{ partial "theme-toggle.html" . }}
    <a class="btn btn-primary" href="{{ "/#contact" | relURL }}">Talk to us</a>
  </nav>
  <button class="icon-btn nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav" data-nav-toggle>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</div>
<nav class="mobile-nav" id="mobile-nav" aria-label="Mobile" data-mobile-nav>
  {{- range site.Menus.main }}
  <a href="{{ .URL | relURL }}">{{ .Name }}</a>
  {{- end }}
  <a class="btn btn-primary" href="{{ "/#contact" | relURL }}">Talk to us</a>
  <div class="mobile-tools"><span>Appearance</span>{{ partial "theme-toggle.html" . }}</div>
</nav>
