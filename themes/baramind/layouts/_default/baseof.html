<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}" data-theme="auto">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      {{ partial "nav.html" . }}
    </header>
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
