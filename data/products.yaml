- id: pysmith
  name: PySmith
  status: Private preview
  tagline: A Python desk for long-running AI agents.
  summary: >-
    A persistent, controlled Python runtime agents reach over MCP. Packages,
    files and processes stay put between sessions, for days or weeks — no
    servers to babysit.
  link: https://pysmith.com
  link_label: Visit pysmith.com ↗
  external: true
  code: |-
    <span class="c">agent →</span> python.exec("import pandas as pd")
    <span class="c">agent →</span> python.exec("df = pd.read_parquet('orders.parquet')")
    <span class="c"># next day, same desk</span>
    <span class="c">agent →</span> python.exec("df.shape")
